name: Build APK

on:
  push:
    branches:
      - master
      - main
      - 'trae/**'
    paths-ignore:
      - '**.md'
      - '**/ISSUE_TEMPLATE/**'
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型 (release / debug)
        required: false
        default: release
        type: choice
        options:
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.run_number }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clear 18PlusList.txt
        run: |
          echo "清空 18PlusList.txt"
          echo "" > "$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt"

      - name: Configure Signing
        run: |
          # 使用仓库自带的 legado.jks 进行签名，无需额外 secrets
          cp "$GITHUB_WORKSPACE/.github/workflows/legado.jks" "$GITHUB_WORKSPACE/app/legado.jks"
          {
            echo "RELEASE_STORE_FILE=./legado.jks"
            echo "RELEASE_KEY_ALIAS=legado"
            echo "RELEASE_STORE_PASSWORD=gedoor_legado"
            echo "RELEASE_KEY_PASSWORD=gedoor_legado"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Unify Version Name
        run: |
          # 用 CI 构建号作为版本号，便于追溯
          sed -i "/def version/c def version = \"3.25.${VERSION}\"" "$GITHUB_WORKSPACE/app/build.gradle"

      - name: Build APK
        run: |
          chmod +x gradlew
          # 首字母大写：release -> Release, debug -> Debug
          TYPE_CAP="$(echo "$BUILD_TYPE" | sed 's/^./\U&/')"
          echo "开始 ${BUILD_TYPE} 构建 (assembleApp${TYPE_CAP})"
          ./gradlew "assembleApp${TYPE_CAP}" --build-cache --parallel --warning-mode all

      - name: Rename APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk/"
          find "$GITHUB_WORKSPACE/app/build/outputs/apk" -name "*.apk" -print -exec \
            mv {} "$GITHUB_WORKSPACE/apk/legado_${BUILD_TYPE}_${VERSION}.apk" \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado_apk_${{ env.VERSION }}
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Mapping
        if: env.BUILD_TYPE != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: legado_mapping_${{ env.VERSION }}
          path: |
            ${{ github.workspace }}/app/build/outputs/mapping/*/mapping.txt
            ${{ github.workspace }}/app/build/outputs/mapping/*/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish Pre-release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: legado_apk_${{ env.VERSION }}
          path: apk/

      - name: Create or Update Pre-release
        uses: softprops/action-gh-release@v2
        with:
          name: legado_${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          body: |
            自动构建版本（基于 ${{ github.sha }}）

            下载下方 APK 安装即可。此版本使用调试签名，与正式版签名不同，升级前请务必备份数据。
          prerelease: true
          files: apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
