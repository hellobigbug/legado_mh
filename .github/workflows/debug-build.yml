name: Debug Build

on:
  push:
    branches:
      - 'trae/agent-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug --stacktrace 2>&1 | tee build.log
          echo "=== BUILD LOG (last 200 lines) ==="
          tail -200 build.log

      - name: Collect APK
        if: always()
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          find ${{ github.workspace }}/app/build/outputs/ -name "*.apk" -exec cp {} ${{ github.workspace }}/apk/ \; 2>/dev/null || true
          ls -la ${{ github.workspace }}/apk/ 2>/dev/null || echo "No APK found"

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legado_debug_apk
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: ignore

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: build.log
